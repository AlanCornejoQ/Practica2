name: DevSecOps CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  devsecops:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # =========================
    # 1. Configuración de Entorno
    # =========================
    - name: Create env files for Docker Compose
      run: |
        cp backend/users-service/.env.example backend/users-service/.env
        cp backend/academic-service/.env.example backend/academic-service/.env
        cp backend/api-gateway/.env.example backend/api-gateway/.env
        
        # Inyección de secretos (Asegúrate de tenerlos en Settings > Secrets de GitHub)
        echo "DB_HOST=${{ secrets.USERS_DB_HOST }}" >> backend/users-service/.env
        echo "DB_PASSWORD=${{ secrets.USERS_DB_PASSWORD }}" >> backend/users-service/.env
        
        cp frontend/.env.example frontend/.env
        echo "VITE_API_URL=http://api-gateway:3000" >> frontend/.env

    # =========================
    # 2. Instalación y CALIDAD (Agregado Linting)
    # =========================
    - name: Install & Lint Frontend
      run: |
        cd frontend
        npm ci
        npm run lint # Cumple con: Análisis de estilo (ESLint) [cite: 59]

    # =========================
    # 3. Testing Automático (Todos los servicios)
    # =========================
    - name: Install & Test Services
      run: |
        cd backend/users-service && npm ci && npm test
        cd ../academic-service && npm ci && npm test
        cd ../api-gateway && npm ci && npm test
        cd ../../frontend && npm test # Cumple con: Testing automático [cite: 61]

    # =========================
    # 4. SAST – Semgrep (Usando tus reglas del repo)
    # =========================
    - name: Install Semgrep
      run: python3 -m pip install semgrep

    - name: SAST Scan (Custom Rules)
      run: |
        # Usamos específicamente tu carpeta de reglas para mayor puntaje
        semgrep --config=backend/semgrep-rules/ backend/ --error # Cumple con: SAST 

    # =========================
    # 5. Build & SCA (Trivy)
    # =========================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      [cite_start]run: docker compose -f backend/docker-compose.yml build # Cumple con: Build de contenedores [cite: 72]

    - name: Trivy Security Scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: users-service
        severity: 'HIGH,CRITICAL'
        [cite_start]exit-code: 1 

    # =========================
    # 6. Smoke Test (Verificación Funcional)
    # =========================
    - name: Run Services & Health Check
      run: |
        docker compose -f backend/docker-compose.yml up -d
        sleep 15
        curl -f http://localhost:3000/health || exit 1